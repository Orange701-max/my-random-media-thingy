<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>My Media Adventure</title>
</head>

<body>

    <center>

        <h1>My Media Adventure Webpage</h1>

        <p>
            this is a webpage that is full of random media
        </p>

        <hr>

        <h2>Apollo 11 </h2>

        <p>
            These images show the Apollo 11 mission.
        </p>

        <img src="apollo11rocket.png" alt="A rocket flying into space" width="300" height="300">
        <img src="moon.png" alt="The Moon" width="300" height="300">
        <img src="neilarmstrong.png" alt="Neil Armstrong" width="300" height="300">

        <hr>

        <h2>Aquatic beats party</h2>

        <p>
            Play the music and enjoy the aquatic animal video.
        </p>

        <audio controls loop>
            <source src="Y2Mate.is -  Happy Music Copyright Free Music - _Lights_ by RoaMusic .mp3" type="audio/mpeg">
            Your browser does not support the audio tag.
        </audio>

        <br><br>

        <video width="500" height="350" controls poster="poster.png" loop>
            <source src="turtle.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <hr>

        <h2>gAmE</h2>

        <p>
            Play this Scratch game.
        </p>

        <iframe src="https://scratch.mit.edu/projects/60917032/embed" allowtransparency="true" width="500" height="400"
            frameborder="0" scrolling="no" allowfullscreen>
        </iframe>

        <hr>

        

    </center>

</body>

</html>
